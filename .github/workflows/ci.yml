name: Package and regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m coverage run -m pytest --junitxml=reports/unit-tests.xml
      - run: python -m coverage report
      - run: python -m coverage xml
      - run: agent-regression demo --repeats 3
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-python-${{ matrix.python-version }}
          path: |
            reports/
            coverage.xml
            dist/

  example-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - name: Reviewed support scenarios with the current agent
        run: >-
          agent-regression run examples/scenarios/support
          --agent agent_regression.demo:make_support_agent
          --repeats 3
          --json-report reports/support.json
          --junit-report reports/support.xml
      - name: Prove the known regression fails
        shell: bash
        run: |
          set +e
          agent-regression demo --broken
          status=$?
          set -e
          test "$status" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-regression-reports
          path: reports/
